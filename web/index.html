<!DOCTYPE html>
<html>
    <head>
        <title>Vue 3 Basics</title>
        <style>
            .box {
                background-color: purple;
                height: 200px;
                width: 200px;
            }
        </style>
    </head>
    <body>
        <div id="app" v-cloak>
            {{ greeting }}
            <input v-model="greeting" />

           <hr />

            <div v-if="isVisible" class="box"></div>
        </div>

        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
        <script>
            let app = Vue.createApp({
                data() {
                    return {
                        greeting: '',
                        isVisible: true,
                        message: ''
                    }
                },
                methods: {
                }
            })

            app.mount('#app')
        </script>
    </body>
</html>
